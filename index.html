<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Биоэтика — права пациента</title><style>*{box-sizing:border-box}body{background:#101622;color:#eef4ff;margin:0;font:16px system-ui}header{background:#111a2b;position:sticky;top:0;padding:16px;border-bottom:1px solid #33435c;z-index:2}h1{font-size:22px;margin:0 0 6px}.sub{color:#a6b7d0;font-size:13px}.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{cursor:pointer;background:#26354e;color:white;border:1px solid #4a5c76;border-radius:9px;padding:10px 13px}.active,.primary{background:#7ce2c2;color:#09241c;border-color:#7ce2c2;font-weight:700}main{max-width:1050px;margin:16px auto;padding:0 14px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}.card,.panel{background:#1b293d;border:1px solid #354962;border-radius:14px;padding:18px;margin:10px 0}.card{min-height:120px}.tag{color:#9bc7ff;font-size:12px}.q{font-size:18px;margin:12px 0;line-height:1.5}.ans{display:none;color:#8be9c6;padding-top:12px;border-top:1px dashed #52627a}.open .ans{display:block}.click{cursor:pointer}.blank{border-bottom:2px solid #8be9c6;color:transparent;cursor:pointer;display:inline-block;min-width:70px}.blank.open{color:#8be9c6}.choice{display:block;width:100%;text-align:left;margin:8px 0}.right{background:#1b664d}.wrong{background:#783342}.note{color:#c2cbd8;font-size:13px}</style></head><body><header><h1>Биоэтика: права пациента</h1><div class="sub">Общий тренажёр по трём материалам · карточки, пропуски и тест</div><nav class="tabs"><button class="active" data-tab="cards">Карточки</button><button data-tab="gaps">Пропуски</button><button data-tab="tests">Тест</button><button data-tab="errors">Ошибки</button></nav></header><main><section id="cards" class="page active"><div class="panel">Карточки идут по порядку. Нажми, чтобы увидеть ответ.<div class="controls"><button class="primary" onclick="mixCards()">Перемешать</button><button onclick="firstCards()">С первой</button></div></div><div class="grid" id="cardsbox"></div></section><section id="gaps" class="page"><div class="panel">Нажми на пропуск, чтобы открыть ответ.<div class="controls"><button class="primary" onclick="mixGaps()">Перемешать</button><button onclick="firstGaps()">С первой</button></div></div><div class="grid" id="gapsbox"></div></section><section id="tests" class="page"><div class="panel">Варианты ответов перемешиваются.<div class="controls"><button onclick="start()">Начать заново</button></div></div><div id="testbox"></div></section><section id="errors" class="page"><div class="panel">Ошибки сохраняются на этом устройстве.<div class="controls"><button onclick="clearErrors()">Очистить</button></div></div><div id="errorsbox"></div></section></main><script>const DATA={"cards": [["Международные права пациента", "Какой документ принят в Лиссабоне в 1981 году?", "Лиссабонская декларация о правах пациента Всемирной медицинской ассоциации (34-я Всемирная медицинская ассамблея, Лиссабон, Португалия, сентябрь–октябрь 1981)."], ["Международные права пациента", "Какие права закрепляет Лиссабонская декларация?", "Свободный выбор врача; независимые решения врача; согласие или отказ после получения информации; конфиденциальность; достойная смерть; принятие или отклонение духовной и моральной поддержки."], ["Международные права пациента", "Когда и где принята Декларация ВОЗ о правах пациента в Европе?", "Амстердам, Нидерланды, 28–30 марта 1994 года."], ["Международные права пациента", "Чем отличаются социальные и индивидуальные права пациента?", "Социальные относятся к доступности медицинской помощи для населения; индивидуальные — к целостности личности, частной жизни, конфиденциальности и убеждениям."], ["Международные права пациента", "Какие разделы прав пациента выделяет Амстердамская декларация?", "Права человека и человеческие ценности; информация; согласие; конфиденциальность и приватность; лечение и организация медицинской помощи; реализация прав."], ["Международные права пациента", "Что пациент вправе знать о своём состоянии?", "Диагноз, прогноз, план лечения, риски и преимущества предлагаемых и альтернативных методов, последствия отказа."], ["Международные права пациента", "Может ли пациент отказаться от получения информации?", "Да, при явно выраженном желании."], ["Международные права пациента", "Что означает информированное согласие?", "Осознанное согласие после получения необходимой информации; предварительное условие медицинского вмешательства."], ["Международные права пациента", "Может ли пациент отказаться от вмешательства?", "Да. Последствия отказа должны быть тщательно разъяснены."], ["Международные права пациента", "Каковы общие правила конфиденциальности по декларации ВОЗ?", "Медицинская и личная информация сохраняется в тайне, включая период после смерти; раскрытие — с явно выраженного согласия или по закону."], ["Международные права пациента", "Какие права относятся к качеству медицинской помощи?", "Доступность без дискриминации, качество, преемственность, выбор врача, достойное обращение и облегчение страданий."], ["Международные права пациента", "Как обеспечивается защита нарушенных прав пациента?", "Право на информацию о правах, консультацию, жалобу и справедливое, эффективное рассмотрение жалобы."], ["Международные права пациента", "Как называется конвенция Совета Европы по биомедицине?", "Конвенция о защите прав и достоинства человека в связи с использованием достижений биологии и медицины (Конвенция о правах человека и биомедицине)."], ["Международные права пациента", "Что закрепляет статья 1 Конвенции о биомедицине?", "Защиту достоинства, индивидуальной целостности и основных прав и свобод человека."], ["Международные права пациента", "Что закрепляет статья 2 Конвенции о биомедицине?", "Приоритет интересов и блага отдельного человека над интересами общества и науки."], ["Международные права пациента", "Что закрепляет статья 3 Конвенции о биомедицине?", "Равную доступность медицинской помощи надлежащего качества с учётом потребностей и ресурсов."], ["Международные права пациента", "Что закрепляет статья 4 Конвенции о биомедицине?", "Медицинские вмешательства, включая исследования, должны соответствовать профессиональным стандартам."], ["Человеческое достоинство", "Что требует статья 3 Всеобщей декларации о биоэтике и правах человека ЮНЕСКО (2005)?", "Уважение человеческого достоинства, прав и свобод; интересы и благосостояние отдельного человека важнее интересов науки или общества."], ["Человеческое достоинство", "Как понималось достоинство в классической античности?", "Как качество, заслуживающее почёта и уважения, связанное с личными качествами и способностью мыслить и принимать решения."], ["Человеческое достоинство", "Как описано достоинство в христианской традиции?", "Оно присуще человеку как созданному по образу и подобию Бога; слабые столь же достойны, как сильные."], ["Человеческое достоинство", "Как описано достоинство в иудаизме?", "Человек должен защищать своё и чужое достоинство; все люди равны и имеют право на свободу и справедливость."], ["Человеческое достоинство", "Как в презентации определяется достоинство в исламской традиции?", "Интегративное понятие, обозначающее совокупность положительных качеств человека."], ["Человеческое достоинство", "Что означает достоинство по И. Канту?", "Безусловная, несоизмеримая ценность человека, связанная с автономией личности, а не богатством, происхождением или статусом."], ["Человеческое достоинство", "Какой принцип Канта важен для прав человека?", "Относиться к человеку как к цели, а не лишь как к средству."], ["Человеческое достоинство", "Что закрепляет статья 1 Всеобщей декларации прав человека?", "Все люди рождаются свободными и равными в достоинстве и правах."], ["Человеческое достоинство", "Что закрепляет статья 21 Конституции РФ?", "Охрану достоинства государством; запрет пыток, насилия и унижающего обращения; запрет опытов без добровольного согласия."], ["Человеческое достоинство", "Чем достоинство отличается от заслуг?", "Достоинство присуще каждому в силу принадлежности к человечеству, а заслуги отражают признанные достижения."], ["Человеческое достоинство", "Что предполагает уважение человеческого достоинства?", "Уважение прав, самооценки, самоопределения, частной жизни и запрет отношения к человеку как к вещи."], ["Вопросы к контрольной", "Правило правдивости", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Аргументы за правдивую информацию о тяжёлом состоянии", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Стандарты информирования", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Компетентность пациента и её критерии", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Частично (временно) некомпетентные пациенты", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Полностью некомпетентные пациенты", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Автономия пациента и критерии", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Модели взаимоотношений врача и пациента", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Кто должен хранить врачебную тайну", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Части врачебной тайны", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."], ["Вопросы к контрольной", "Случаи разглашения врачебной тайны без согласия", "В приложенных материалах вопрос указан, но развёрнутого ответа на него нет. Требуется дополнительный конспект или источник."]], "gaps": [["Лиссабонская декларация принята в ___ году.", "1981"], ["Амстердамская декларация ВОЗ принята в ___ году.", "1994"], ["Статья 2 Конвенции закрепляет ___ человека.", "приоритет"], ["Вся медицинская информация должна сохраняться в ___.", "тайне"], ["Информированное ___ предшествует медицинскому вмешательству.", "согласие"], ["По Канту человек должен быть целью, а не только ___.", "средством"], ["Достоинство личности охраняется ___.", "государством"], ["Статья 3 Конвенции касается равной ___ медицинской помощи.", "доступности"], ["Пациент имеет право на ___ врача.", "выбор"], ["Права на приватность и конфиденциальность относятся к ___ правам.", "индивидуальным"]], "tests": [["Где принята декларация ВМА 1981 года?", ["Лиссабон", "Амстердам", "Страсбург"], 0], ["Какой год принятия Амстердамской декларации ВОЗ?", ["1981", "1994", "2005"], 1], ["Что является предварительным условием вмешательства?", ["Согласие администрации", "Информированное согласие", "Устное решение врача"], 1], ["Что выше интересов науки согласно статье 2 Конвенции?", ["Интересы и благо отдельного человека", "Интересы научного сообщества", "Интересы учреждения"], 0], ["Какое право упоминает Лиссабонская декларация?", ["Право свободно выбирать врача", "Право требовать любую операцию", "Право назначать себе лекарства"], 0], ["Какое право является индивидуальным?", ["Право на конфиденциальность", "Финансирование всей системы здравоохранения", "Общее планирование бюджета"], 0], ["По Канту достоинство зависит от ...", ["Дохода", "Социального положения", "Автономии личности"], 2], ["Что гарантирует статья 21 Конституции РФ?", ["Охрану достоинства личности", "Бесплатное лечение в любой стране", "Право на конкретное лекарство"], 0], ["Какая статья Конвенции посвящена профессиональным стандартам?", ["Статья 4", "Статья 2", "Статья 1"], 0], ["Какое право предусмотрено в декларации ВОЗ?", ["Отказ от информации", "Обязанность узнать диагноз", "Запрет второго мнения"], 0], ["Когда допустимо раскрытие конфиденциальной информации по декларации ВОЗ?", ["При ясно выраженном согласии пациента либо по закону", "По любому запросу знакомого", "По желанию любого сотрудника"], 0], ["Какая дата связана с документом ЮНЕСКО о биоэтике?", ["1948", "2005", "1981"], 1]]};const D=DATA;let ci=D.cards.map((_,i)=>i),gi=D.gaps.map((_,i)=>i),qi=[],pos=0,score=0,done=false,errors=new Set(JSON.parse(localStorage.getItem('bioethics-errors')||'[]'));function sh(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab],.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');if(b.dataset.tab==='errors')renderErrors()});function renderCards(){document.getElementById('cardsbox').innerHTML=ci.map(i=>`<div class="card click" onclick="this.classList.toggle('open')"><div class="tag">${esc(D.cards[i][0])}</div><div class="q">${esc(D.cards[i][1])}</div><div class="ans">${esc(D.cards[i][2])}</div><div class="note">Нажми для ответа</div></div>`).join('')}function mixCards(){sh(ci);renderCards()}function firstCards(){ci=D.cards.map((_,i)=>i);renderCards()}function renderGaps(){document.getElementById('gapsbox').innerHTML=gi.map(i=>`<div class="card"><div class="q">${esc(D.gaps[i][0]).replace('___',`<span class="blank" onclick="this.classList.toggle('open')">${esc(D.gaps[i][1])}</span>`)}</div></div>`).join('')}function mixGaps(){sh(gi);renderGaps()}function firstGaps(){gi=D.gaps.map((_,i)=>i);renderGaps()}function start(){qi=sh(D.tests.map((_,i)=>i));pos=score=0;next()}function next(){done=false;if(pos===qi.length){document.getElementById('testbox').innerHTML=`<div class="card"><h2>Результат: ${score} из ${qi.length}</h2><button class="primary" onclick="start()">Пройти ещё раз</button></div>`;return}let i=qi[pos],t=D.tests[i],order=sh(t[1].map((_,j)=>j));document.getElementById('testbox').innerHTML=`<div class="card"><div class="tag">Вопрос ${pos+1} / ${qi.length}</div><div class="q">${esc(t[0])}</div><div id="choices"></div><div id="nextbtn"></div></div>`;let b=document.getElementById('choices');order.forEach(k=>{let x=document.createElement('button');x.className='choice';x.textContent=t[1][k];x.onclick=()=>answer(i,k,x);b.appendChild(x)})}function answer(i,k,b){if(done)return;done=true;let t=D.tests[i];document.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x.textContent===t[1][t[2]])x.classList.add('right')});if(k===t[2])score++;else{b.classList.add('wrong');errors.add(i);localStorage.setItem('bioethics-errors',JSON.stringify([...errors]))}document.getElementById('nextbtn').innerHTML='<button class="primary" onclick="pos++;next()">Далее →</button>'}function renderErrors(){document.getElementById('errorsbox').innerHTML=[...errors].map(i=>`<div class="card"><div class="q">${esc(D.tests[i][0])}</div><div class="ans" style="display:block">${esc(D.tests[i][1][D.tests[i][2]])}</div></div>`).join('')||'<div class="panel">Ошибок нет.</div>'}function clearErrors(){errors.clear();localStorage.removeItem('bioethics-errors');renderErrors()}renderCards();renderGaps();start();</script></body></html>
